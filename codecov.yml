# https://docs.codecov.com/docs/codecov-yaml
# Uploaded from CI: .github/workflows/publish.yml (ubuntu + Python 3.11, unit tests).

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # Whole-repo coverage (should match pyproject.toml --cov-fail-under=80).
    project:
      default:
        target: 80%
        threshold: 1% # allow small drops vs base branch
        base: auto
        if_ci_failed: error

    # Lines changed in the PR — stricter than project, but not ~99% default.
    patch:
      default:
        target: 90%
        threshold: 0%
        base: auto
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

# Optional: don’t count these toward coverage reports (not your package code).
ignore:
  - "tests/**"
  - "scripts/**"
  - "docs/**"
