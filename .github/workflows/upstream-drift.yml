name: Upstream drift

on:
  schedule:
    # Monday 06:17 UTC. Pull-request CI stays unit-only: this job needs the
    # network, same reason the live lake tests are opt-in (workflow_dispatch
    # or the run-integration label) rather than part of every PR.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: meco-front datasets and query guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for upstream drift
        run: uv run python scripts/check_upstream_drift.py
