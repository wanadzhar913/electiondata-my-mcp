# https://pre-commit.com
# Install once per clone: uv run pre-commit install
# Run on demand:         uv run pre-commit run --all-files
# Upstream copy-prompt.md is copied verbatim into prompts/; do not normalize whitespace there.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/electiondata_my_mcp/prompts/
      - id: end-of-file-fixer
        exclude: ^src/electiondata_my_mcp/prompts/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        exclude: ^src/electiondata_my_mcp/prompts/
      - id: debug-statements

  # rev must match the pinned ruff dev dependency in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
