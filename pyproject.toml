[project]
name = "electiondata-my-mcp"
version = "0.1.0"
description = "An MCP server that lets an LLM answer questions about Malaysian elections by writing DuckDB SQL against the public ElectionData.MY data lake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "mcp[cli]>=2.1.1",
]
license = { text = "CC0-1.0" }
authors = [
    { name = "Faiq Adzlan", email = "adzhar.faiq@gmail.com" }
]

[project.scripts]
electiondata-my-mcp = "electiondata_my_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/electiondata_my_mcp"]

[dependency-groups]
dev = [
    "inline-snapshot>=0.35.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.0",
]

# uv special-cases `dev` and would otherwise install it on every `uv sync`.
[tool.uv]
default-groups = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["electiondata_my_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=electiondata_my_mcp --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["electiondata_my_mcp"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
